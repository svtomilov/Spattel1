<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spattel — ремонт квартир под ключ в Перми</title>
    <meta
      name="description"
      content="Spattel — ремонт квартир под ключ в Перми. Готовим новый сайт, пока пишите нам в Телеграм."
    />
    <meta name="theme-color" content="#FDF7EE" />
    <link rel="canonical" href="https://spattel.ru/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Spattel" />
    <meta property="og:url" content="https://spattel.ru/" />
    <meta property="og:title" content="Spattel — ремонт квартир под ключ в Перми" />
    <meta property="og:description" content="Ремонтируем жизнь к лучшему. Готовим новый сайт." />

    <link rel="icon" href="spattel-logo.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Одна гарнитура на всю страницу: антиква, как в логотипе. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="assets/bg-desktop.webp" media="(min-width: 721px)" />
    <link rel="preload" as="image" href="assets/bg-mobile.webp" media="(max-width: 720px)" />

    <style>
      /* Токены фирменного стиля «Тёплый дом». Значения из дизайн-системы, не подобраны на глаз. */
      :root {
        --brand-ink: #2c1c0d;
        --brand-cream: #fdf7ee;
        --muted: #6b5744; /* 6.1:1 на закрашенном поле */
        --terracotta: #b8462a; /* цвет действия; белый на нём 5.3:1 */
        --terracotta-hover: #a13d24;
        --font: 'Spectral', Georgia, 'Times New Roman', serif;
        --step: 1s; /* шаг появления: логотип → слоган → текст → ссылка */
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--brand-cream);
        color: var(--brand-ink);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      /*
       * Фон — рисунок, в котором мастера уже закрасили светлое поле. Текст ставится внутрь этого
       * поля: его центр у обоих кадров примерно на 56% по ширине и 38% по высоте.
       */
      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image: url('assets/bg-desktop.webp');
        background-size: cover;
        background-position: center;
      }
      @media (min-width: 721px) and (max-width: 1200px) {
        .bg {
          background-image: url('assets/bg-desktop-sm.webp');
        }
      }
      @media (max-width: 720px) {
        .bg {
          background-image: url('assets/bg-mobile.webp');
        }
      }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100svh;
      }

      .stack {
        position: absolute;
        left: 56%;
        top: 38%;
        transform: translate(-50%, -50%);
        width: min(30rem, 46vw);
        display: grid;
        gap: clamp(14px, 1.6vw, 24px);
      }

      .logo {
        display: block;
        width: clamp(170px, 19vw, 300px);
        height: auto;
      }

      .tagline {
        margin: 0;
        font-size: clamp(0.68rem, 0.92vw, 0.88rem);
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .note {
        margin: 0;
        font-weight: 600;
        font-size: clamp(1.15rem, 1.9vw, 1.9rem);
        line-height: 1.24;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }

      .contact {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        justify-self: start;
        margin-top: clamp(2px, 0.6vw, 8px);
        padding: 13px 24px 13px 20px;
        border-radius: 999px;
        background: var(--terracotta);
        color: #fff;
        font-size: clamp(0.92rem, 1.1vw, 1.05rem);
        font-weight: 600;
        text-decoration: none;
        transition:
          transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
          background-color 0.24s ease;
      }
      .contact:hover {
        transform: translateY(-2px);
        background: var(--terracotta-hover);
      }
      .contact:focus-visible {
        outline: 3px solid var(--brand-ink);
        outline-offset: 3px;
      }
      .contact svg {
        flex: none;
      }

      /*
       * Оферта и политика продолжают работать по прямым адресам. Без этой строки на них не вело бы
       * ни одной ссылки с сайта, а политика обязательна: форма заявки собирает имя и телефон.
       */
      .legal {
        margin: 0;
        font-size: clamp(0.72rem, 0.82vw, 0.82rem);
        line-height: 1.5;
        color: var(--muted);
      }
      .legal a {
        color: inherit;
        text-underline-offset: 0.22em;
        text-decoration-thickness: 1px;
      }
      .legal a:hover {
        color: var(--terracotta);
      }
      .legal a:focus-visible {
        outline: 2px solid var(--brand-ink);
        outline-offset: 3px;
      }
      .legal span {
        opacity: 0.55;
        padding: 0 0.3em;
      }

      /* Последовательное появление: логотип, через секунду слоган, ещё через секунду текст,
         следом ссылка. */
      .reveal {
        opacity: 0;
        transform: translateY(12px);
        animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .reveal--1 { animation-delay: 0.15s; }
      .reveal--2 { animation-delay: calc(0.15s + var(--step)); }
      .reveal--3 { animation-delay: calc(0.15s + var(--step) * 2); }
      .reveal--4 { animation-delay: calc(0.15s + var(--step) * 2.6); }
      .reveal--5 { animation-delay: calc(0.15s + var(--step) * 3.1); }

      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal {
          opacity: 1;
          transform: none;
          animation: none;
        }
      }

      @media (max-width: 720px) {
        .stack {
          left: 55%;
          top: 37%;
          width: min(21rem, 70vw);
          gap: clamp(12px, 3.2vw, 20px);
        }
        .logo {
          width: clamp(150px, 42vw, 220px);
        }
        .tagline {
          font-size: 0.7rem;
        }
        .note {
          font-size: clamp(1.05rem, 4.6vw, 1.35rem);
        }
        .contact {
          font-size: 0.95rem;
        }
        .legal {
          font-size: 0.75rem;
        }
      }

      /* Очень низкие и широкие окна: поле на рисунке становится узким, подстраиваем блок. */
      @media (min-width: 721px) and (max-height: 620px) {
        .stack {
          top: 40%;
          width: min(26rem, 42vw);
          gap: 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="bg" role="img" aria-label="Мастера Spattel красят стену валиками на закате"></div>

    <main class="page">
      <div class="stack">
        <img
          class="logo reveal reveal--1"
          src="assets/logo-primary.svg"
          alt="Spattel"
          width="1096"
          height="360"
        />

        <p class="tagline reveal reveal--2">Ремонтируем жизнь к лучшему</p>

        <p class="note reveal reveal--3">
          Работаем над сайтом, чтобы всё было красиво и удобно
        </p>

        <a class="contact reveal reveal--4" href="https://t.me/s_tomilov">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M21.7 3.4 2.9 10.6c-1.1.4-1.1 1.1-.2 1.4l4.7 1.5 1.8 5.5c.2.6.4.8 1 .8.5 0 .7-.2 1-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.5c.3-1.2-.5-1.8-1.3-1.9Zm-3.3 3.7-8.7 7.9-.3 3.6-1.8-5.4 10.1-6.5c.5-.3.9-.1.7.4Z"
            />
          </svg>
          Написать в Телеграм
        </a>

        <p class="legal reveal reveal--5">
          <a href="privacy.html">Политика конфиденциальности</a><span>·</span><a href="oferta.html">Оферта</a>
        </p>
      </div>
    </main>
  </body>
</html>
